[project]
name = "iaqualink-mcp"
version = "0.1.0"
description = "MCP server for controlling a Jandy iAqualink pool/spa system"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["mcp", "iaqualink", "pool", "spa", "jandy", "zodiac", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "iaqualink>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/jgonzalez007/iaqualink-mcp"
Issues = "https://github.com/jgonzalez007/iaqualink-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
iaqualink-mcp = "iaqualink_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iaqualink_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
